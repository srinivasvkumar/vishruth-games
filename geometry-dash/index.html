<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <title>Geometry Dash Clone</title>
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
      font-family: 'Arial', sans-serif;
    }

    /* Game container - FORCE dimensions with !important */
    #game-container {
      width: 100vw !important;
      height: 100vh !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      display: block !important;
    }

    /* Phaser canvas styles */
    #game-container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      image-rendering: pixelated;
    }

    /* DOM UI overlay */
    .ui-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      pointer-events: none;
      z-index: 1000 !important;
    }

    /* Score display */
    .score-display {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 48px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 1001 !important;
    }

    /* Menu overlay */
    .menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.7);
      pointer-events: auto;
      z-index: 1002 !important;
    }

    .menu-title {
      font-size: 72px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
      margin-bottom: 40px;
    }

    .menu-button {
      padding: 20px 60px;
      font-size: 32px;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      pointer-events: auto;
    }

    .menu-button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
    }

    .menu-button:active {
      transform: scale(0.98);
    }

    /* Game over screen */
    .game-over-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.8);
      pointer-events: auto;
      z-index: 1002 !important;
    }

    .game-over-title {
      font-size: 64px;
      font-weight: bold;
      color: #ff4757;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
      margin-bottom: 20px;
    }

    .final-score {
      font-size: 36px;
      color: #ffffff;
      margin-bottom: 40px;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .menu-title {
        font-size: 48px;
      }
      
      .menu-button {
        padding: 15px 40px;
        font-size: 24px;
      }
      
      .score-display {
        font-size: 32px;
        top: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Force game container dimensions with inline styles -->
  <div id="game-container" style="width:100vw;height:100vh;position:fixed;top:0;left:0;"></div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
