<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClusterRush</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 20px;
        }
        h1 { font-size: 3em; letter-spacing: 0.1em; text-transform: uppercase; }
        .game-link {
            display: inline-block;
            padding: 15px 40px;
            background: #e63946;
            color: #fff;
            text-decoration: none;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.2s, background 0.2s;
        }
        .game-link:hover { transform: scale(1.1); background: #c1121f; }
        .sub { color: #aaa; font-size: 1.1em; }
    </style>
    <script>
        window.location.href = 'Builds/WebGL/index.html';
    </script>
</head>
<body>
    <h1>ClusterRush</h1>
    <p class="sub">Loading game...</p>
    <a href="Builds/WebGL/index.html" class="game-link">Play Now</a>
</body>
</html>
