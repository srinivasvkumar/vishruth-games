                        <body>
                            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eee;
        }

        .game-container {
            width: 380px;
            padding: 20px;
            background: rgba(20, 20, 35, 0.6);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .brand {
            font-size: 40px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .btn-new-game {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #ff8c00, #ff5e3a);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 3px 10px rgba(255, 94, 58, 0.3);
        }

        .btn-new-game:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 94, 58, 0.4);
        }

        .user-section {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }

        .user-section input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: #eee;
            font-size: 14px;
            outline: none;
            transition: border 0.2s, background 0.2s;
        }

        .user-section input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .user-section input:focus {
            border-color: #ff8c00;
            background: rgba(255, 255, 255, 0.12);
        }

        .scores-section {
            display: flex;
            gap: 10px;
        }

        .score-box {
            flex: 1;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .score-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 26px;
            font-weight: 700;
            color: #ffd700;
        }

        .best-holder {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 2px;
        }

        .board-container {
            position: relative;
            width: 370px;
            height: 370px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
        }

        .board {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        .grid-background {
            position: absolute;
            top: 10px;
            left: 10px;
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 10px;
        }

        .grid-cell {
            width: 80px;
            height: 80px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tile {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
            transition: transform 0.12s ease-in-out, background 0.12s ease;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .tile[data-value="2"] {
            background: linear-gradient(135deg, #eee4da, #ede0c8);
            color: #776e65;
            box-shadow: 0 1px 4px rgba(119, 110, 101, 0.3);
        }
        .tile[data-value="4"] {
            background: linear-gradient(135deg, #ede0c8, #eadab8);
            color: #776e65;
            box-shadow: 0 1px 4px rgba(119, 110, 101, 0.3);
        }
        .tile[data-value="8"] {
            background: linear-gradient(135deg, #f2b179, #f5a06e);
            color: white;
        }
        .tile[data-value="16"] {
            background: linear-gradient(135deg, #f59563, #f77c4a);
            color: white;
        }
        .tile[data-value="32"] {
            background: linear-gradient(135deg, #f67c5f, #f55e3b);
            color: white;
        }
        .tile[data-value="64"] {
            background: linear-gradient(135deg, #f65e3b, #f6401e);
            color: white;
        }
        .tile[data-value="128"] {
            background: linear-gradient(135deg, #edcf72, #edc65a);
            color: white;
        }
        .tile[data-value="256"] {
            background: linear-gradient(135deg, #edcc61, #edc34c);
            color: white;
        }
        .tile[data-value="512"] {
            background: linear-gradient(135deg, #edc850, #edbf3e);
            color: white;
        }
        .tile[data-value="1024"] {
            background: linear-gradient(135deg, #edc53f, #edbc33);
            color: white;
        }
        .tile[data-value="2048"] {
            background: linear-gradient(135deg, #edc22e, #edb81e);
            color: white;
            box-shadow: 0 0 20px rgba(237, 194, 46, 0.5);
        }
        .tile[data-value="4096"] {
            background: linear-gradient(135deg, #3c3a32, #2d2a22);
            color: white;
        }
        .tile[data-value="8192"] {
            background: linear-gradient(135deg, #2d2a22, #1a1812);
            color: white;
        }

        .tile-new {
            animation: tile-appear 0.15s ease-out;
        }

        @keyframes tile-appear {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            60% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .tile-merged {
            animation: merge-pop 0.1s ease-in-out;
        }

        @keyframes merge-pop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 25, 0.8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .game-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .overlay-content {
            text-align: center;
            padding: 30px;
            background: rgba(30, 30, 50, 0.9);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .game-overlay.visible .overlay-content {
            transform: scale(1);
        }

        .overlay-content h2 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .overlay-content p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 16px;
            font-size: 14px;
        }

        .overlay-content button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff8c00, #ff5e3a);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 12px rgba(255, 94, 58, 0.3);
        }

        .overlay-content button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 94, 58, 0.4);
        }

        .footer {
            margin-top: 14px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            line-height: 1.6;
        }

        .footer .keys {
            color: rgba(255, 215, 0, 0.7);
            font-weight: 600;
        }

        @media (max-width: 420px) {
            .game-container {
                width: 100%;
                padding: 12px;
            }
            .board-container {
                width: 100%;
                height: auto;
                aspect-ratio: 1;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="brand-row">
                <div class="brand">2048</div>
                <button class="btn-new-game" id="newGameBtn">New Game</button>
            </div>
            <div class="user-section">
                <input type="text" id="playerName" placeholder="Enter your name..." maxlength="20">
            </div>
            <div class="scores-section">
                <div class="score-box">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="scoreDisplay">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Best</div>
                    <div class="score-value" id="bestDisplay">0</div>
                    <div class="best-holder" id="bestHolder">—</div>
                </div>
            </div>
        </div>
        <div class="board-container">
            <div class="board" id="board">
                <div class="grid-background">
                    <div class="grid-cell"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div>
                </div>
            </div>
            <div class="game-overlay" id="gameOverlay">
                <div class="overlay-content">
                    <h2 id="overlayTitle">Game Over</h2>
                    <p id="overlayMessage">Try again!</p>
                    <button id="restartBtn">Play Again</button>
                </div>
            </div>
        </div>
        <div class="footer">
            <p>Use <span class="keys">↑ ↓ ← →</span> arrow keys to move. <br> Merge tiles to reach <span class="keys">2048</span>!</p>
        </div>
    </div>

    <script>
        const SIZE = 4;
        const CELL_SIZE = 80;
        const GAP = 10;
        const PADDING = 10;

        // ---------- Tile class ----------
        class Tile {
            constructor(id, row, col, value) {
                this.id = id;
                this.row = row;
                this.col = col;
                this.value = value;
                this.mergedFrom = null;
                this.isNew = false;
            }
        }

        // ---------- Game class ----------
        class Game2048 {
            constructor() {
                this.size = SIZE;
                this.score = 0;
                this.highscore = 0;
                this.tileIdCounter = 0;
                this.grid = [];
                this.tileElements = {};
                this.gameOver = false;
                this.won = false;
                this.playerName = '';

                this.boardEl = document.getElementById('board');
                this.scoreEl = document.getElementById('scoreDisplay');
                this.bestEl = document.getElementById('bestDisplay');
                this.bestHolderEl = document.getElementById('bestHolder');
                this.overlayEl = document.getElementById('gameOverlay');
                this.overlayTitleEl = document.getElementById('overlayTitle');
                this.overlayMsgEl = document.getElementById('overlayMessage');
                this.restartBtn = document.getElementById('restartBtn');
                this.newGameBtn = document.getElementById('newGameBtn');
                this.nameInput = document.getElementById('playerName');

                this.loadState();
                this.setupListeners();
                this.init();
            }

            // ---- localStorage ----
            loadState() {
                this.highscore = parseInt(localStorage.getItem('highscore') || '0');
                this.playerName = localStorage.getItem('playerName') || '';
                if (this.playerName) {
                    this.nameInput.value = this.playerName;
                }
                this.bestEl.textContent = this.highscore;
                this.bestHolderEl.textContent = localStorage.getItem('highscoreHolder') || '—';
            }

            saveHighscore() {
                localStorage.setItem('highscore', this.highscore);
                localStorage.setItem('highscoreHolder', this.playerName || 'Unknown');
                this.bestEl.textContent = this.highscore;
                this.bestHolderEl.textContent = localStorage.getItem('highscoreHolder') || '—';
            }

            saveName() {
                this.playerName = this.nameInput.value.trim();
                localStorage.setItem('playerName', this.playerName);
            }

            // ---- Init ----
            init() {
                this.grid = Array.from({ length: this.size }, () => Array(this.size).fill(null));
                this.tileElements = {};
                this.score = 0;
                this.gameOver = false;
                this.won = false;
                this.tileIdCounter = 0;

                // Clear tile elements
                this.boardEl.querySelectorAll('.tile').forEach(el => el.remove());

                this.addRandomTile();
                this.addRandomTile();

                this.scoreEl.textContent = this.score;
                this.hideOverlay();
            }

            reset() {
                this.saveName();
                this.init();
            }

            // ---- Board helpers ----
            tilePosition(row, col) {
                const x = PADDING + col * (CELL_SIZE + GAP);
                const y = PADDING + row * (CELL_SIZE + GAP);
                return `translate(${x}px, ${y}px)`;
            }

            addRandomTile() {
                let empty = [];
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c] === null) empty.push([r, c]);
                    }
                }
                if (empty.length === 0) return null;
                const [r, c] = empty[Math.floor(Math.random() * empty.length)];
                const value = Math.random() < 0.9 ? 2 : 4;
                const tile = new Tile(this.tileIdCounter++, r, c, value);
                tile.isNew = true;
                this.grid[r][c] = tile;
                this.createTileElement(tile);
                return tile;
            }

            createTileElement(tile) {
                const el = document.createElement('div');
                el.className = 'tile';
                el.dataset.id = tile.id;
                el.dataset.value = tile.value;
                el.textContent = tile.value;
                el.style.transform = this.tilePosition(tile.row, tile.col);
                el.style.left = '0px';
                el.style.top = '0px';
                this.boardEl.appendChild(el);
                this.tileElements[tile.id] = el;

                if (tile.isNew) {
                    el.classList.add('tile-new');
                    setTimeout(() => {
                        el.classList.remove('tile-new');
                        tile.isNew = false;
                    }, 150);
                }
            }

            updateTileElement(tile) {
                const el = this.tileElements[tile.id];
                if (!el) return;
                el.dataset.value = tile.value;
                el.textContent = tile.value;
                el.style.transform = this.tilePosition(tile.row, tile.col);

                if (tile.mergedFrom) {
                    el.classList.remove('tile-merged');
                    void el.offsetWidth; // reflow
                    el.classList.add('tile-merged');
                    setTimeout(() => {
                        el.classList.remove('tile-merged');
                    }, 120);
                    tile.mergedFrom = null;
                }
            }

            removeTileElement(id) {
                const el = this.tileElements[id];
                if (el) {
                    el.remove();
                    delete this.tileElements[id];
                }
            }

            findTileById(id) {
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c] !== null && this.grid[r][c].id === id) {
                            return this.grid[r][c];
                        }
                    }
                }
                return null;
            }

            // ---- Move logic ----
            move(direction) {
                if (this.gameOver && !this.won) return false;

                // Save old positions
                const oldPositions = {};
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c] !== null) {
                            oldPositions[this.grid[r][c].id] = {
                                row: r,
                                col: c,
                                value: this.grid[r][c].value
                            };
                        }
                    }
                }

                let scoreDelta = 0;

                for (let i = 0; i < this.size; i++) {
                    let lineTiles = [];

                    for (let j = 0; j < this.size; j++) {
                        let row, col, pos;
                        switch (direction) {
                            case 'left':
                                row = i;
                                col = j;
                                pos = j;
                                break;
                            case 'right':
                                row = i;
                                col = this.size - 1 - j;
                                pos = j;
                                break;
                            case 'up':
                                row = j;
                                col = i;
                                pos = j;
                                break;
                            case 'down':
                                row = this.size - 1 - j;
                                col = i;
                                pos = j;
                                break;
                        }
                        if (this.grid[row][col] !== null) {
                            lineTiles.push({ tile: this.grid[row][col], pos });
                        }
                    }

                    lineTiles.sort((a, b) => a.pos - b.pos);

                    let newLine = [];
                    for (let k = 0; k < lineTiles.length; k++) {
                        newLine.push(lineTiles[k].tile);
                    }
                    while (newLine.length < this.size) newLine.push(null);

                    // Merge
                    for (let k = 0; k < this.size - 1; k++) {
                        if (newLine[k] !== null && newLine[k + 1] !== null &&
                            newLine[k].value === newLine[k + 1].value) {

                            const mergedValue = newLine[k].value * 2;
                            newLine[k].value = mergedValue;
                            newLine[k].mergedFrom = [newLine[k], newLine[k + 1]];
                            newLine[k + 1] = null;
                            scoreDelta += mergedValue;

                            for (let m = k + 1; m < this.size - 1; m++) {
                                newLine[m] = newLine[m + 1];
                            }
                            newLine[this.size - 1] = null;
                            k--;
                        }
                    }

                    // Clear old positions
                    for (let j = 0; j < this.size; j++) {
                        let row, col;
                        switch (direction) {
                            case 'left':
                                row = i;
                                col = j;
                                break;
                            case 'right':
                                row = i;
                                col = this.size - 1 - j;
                                break;
                            case 'up':
                                row = j;
                                col = i;
                                break;
                            case 'down':
                                row = this.size - 1 - j;
                                col = i;
                                break;
                        }
                        this.grid[row][col] = null;
                    }

                    // Place tiles
                    for (let k = 0; k < this.size; k++) {
                        if (newLine[k] !== null) {
                            let row, col;
                            switch (direction) {
                                case 'left':
                                    row = i;
                                    col = k;
                                    break;
                                case 'right':
                                    row = i;
                                    col = this.size - 1 - k;
                                    break;
                                case 'up':
                                    row = k;
                                    col = i;
                                    break;
                                case 'down':
                                    row = this.size - 1 - k;
                                    col = i;
                                    break;
                            }
                            newLine[k].row = row;
                            newLine[k].col = col;
                            this.grid[row][col] = newLine[k];
                        }
                    }
                }

                // Check moved
                let moved = false;

                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c] !== null) {
                            const tile = this.grid[r][c];
                            const old = oldPositions[tile.id];
                            if (old && (old.row !== r || old.col !== c || old.value !== tile.value)) {
                                moved = true;
                            }
                        }
                    }
                }

                for (const id in oldPositions) {
                    let found = false;
                    for (let r = 0; r < this.size; r++) {
                        for (let c = 0; c < this.size; c++) {
                            if (this.grid[r][c] !== null && this.grid[r][c].id === parseInt(id)) {
                                found = true;
                            }
                        }
                    }
                    if (!found) moved = true;
                }

                if (scoreDelta > 0) moved = true;

                if (!moved) return false;

                this.score += scoreDelta;

                // Remove merged tile elements
                for (const id in this.tileElements) {
                    const tile = this.findTileById(parseInt(id));
                    if (!tile) {
                        this.removeTileElement(parseInt(id));
                    }
                }

                // Update tile elements
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c] !== null) {
                            this.updateTileElement(this.grid[r][c]);
                        }
                    }
                }

                // Add new tile
                this.addRandomTile();

                // Update score UI
                this.scoreEl.textContent = this.score;

                // Highscore
                if (this.score > this.highscore) {
                    this.highscore = this.score;
                    this.saveHighscore();
                }

                // Check game over
                if (this.checkGameOver()) {
                    this.showGameOver();
                }

                // Check win
                if (!this.won) {
                    this.checkWin();
                }

                return true;
            }

            checkGameOver() {
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c] === null) return false;
                    }
                }
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (c < this.size - 1 && this.grid[r][c].value === this.grid[r][c + 1].value) return false;
                        if (r < this.size - 1 && this.grid[r][c].value === this.grid[r + 1][c].value) return false;
                    }
                }
                this.gameOver = true;
                return true;
            }

            checkWin() {
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c] !== null && this.grid[r][c].value === 2048) {
                            this.won = true;
                            this.showWin();
                            return;
                        }
                    }
                }
            }

            // ---- UI ----
            showGameOver() {
                this.overlayTitleEl.textContent = 'Game Over';
                this.overlayMsgEl.textContent = 'Score: ' + this.score + ' · Try again!';
                this.restartBtn.textContent = 'Play Again';
                this.overlayEl.classList.add('visible');
            }

            showWin() {
                this.overlayTitleEl.textContent = 'You Win!';
                this.overlayMsgEl.textContent = 'Reached 2048! Keep going for more.';
                this.restartBtn.textContent = 'Keep Playing';
                this.overlayEl.classList.add('visible');
            }

            hideOverlay() {
                this.overlayEl.classList.remove('visible');
            }

            // ---- Listeners ----
            setupListeners() {
                document.addEventListener('keydown', (e) => {
                    const keys = ['ArrowUp', 'ArrowRight', 'ArrowDown', 'ArrowLeft'];
                    if (keys.includes(e.key)) {
                        e.preventDefault();
                        const dir = {
                            'ArrowUp': 'up',
                            'ArrowRight': 'right',
                            'ArrowDown': 'down',
                            'ArrowLeft': 'left'
                        } [e.key];
                        this.saveName();
                        this.move(dir);
                    }
                });

                this.restartBtn.addEventListener('click', () => {
                    if (this.won && !this.gameOver) {
                        // Keep playing after win
                        this.overlayEl.classList.remove('visible');
                        this.won = false;
                        this.gameOver = false;
                        // Just continue, don't reset
                    } else {
                        this.reset();
                    }
                });

                this.newGameBtn.addEventListener('click', () => {
                    this.saveName();
                    this.reset();
                });

                this.nameInput.addEventListener('blur', () => this.saveName());

                // Touch swipe
                let startX = 0,
                    startY = 0;
                const boardContainer = document.querySelector('.board-container');
                boardContainer.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                });

                boardContainer.addEventListener('touchend', (e) => {
                    if (startX === 0 && startY === 0) return;
                    const dx = e.changedTouches[0].clientX - startX;
                    const dy = e.changedTouches[0].clientY - startY;
                    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
                    this.saveName();
                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0) this.move('right');
                        else this.move('left');
                    } else {
                        if (dy > 0) this.move('down');
                        else this.move('up');
                    }
                    startX = 0;
                    startY = 0;
                });
            }
        }

        // ---------- Start the game ----------
        const game = new Game2048();
    </script>
