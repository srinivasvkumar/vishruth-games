<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  .ttt-wrap { width: 340px; padding: 16px; box-sizing: border-box; color: var(--foreground); }
  .ttt-wrap * { box-sizing: border-box; font-family: inherit; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  .status { min-height: 22px; margin: 6px 0 10px; font-size: 14px; color: var(--muted-foreground); }
  .status.win { color: var(--accent); font-weight: 600; }
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .cell { aspect-ratio: 1; border: 1px solid var(--border); border-radius: 10px; background: var(--card);
          font-size: 34px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
          transition: background .15s, transform .1s; color: var(--foreground); }
  .cell:hover:not(.taken) { background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
  .cell.x { color: var(--accent); }
  .cell.o { color: var(--muted-foreground); }
  .cell.line { outline: 2px solid var(--accent); outline-offset: -2px; }
  .controls { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  button, select { font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
                   background: var(--card); color: var(--foreground); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .scores { margin-top: 10px; font-size: 13px; color: var(--muted-foreground); display: flex; gap: 14px; }
  .scores b { color: var(--foreground); }
</style>
</head>
<body>
<div class="ttt-wrap">
  <h2>Tic Tac Toe</h2>
  <div class="status" id="status"></div>
  <div class="board" id="board"></div>
  <div class="controls">
    <select id="mode">
      <option value="2p">2 Players</option>
      <option value="cpu" selected>vs Computer</option>
    </select>
    <button class="primary" id="new">New round</button>
  </div>
  <div class="scores">X <b id="sx">0</b> &nbsp; O <b id="so">0</b> &nbsp; Draws <b id="sd">0</b></div>
</div>
<script>
(() => {
  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let cells, board, turn, over, scores = {X:0,O:0,D:0};
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const modeEl = document.getElementById('mode');

  function newRound() {
    board = Array(9).fill(null); over = false; turn = 'X';
    boardEl.innerHTML = '';
    cells = board.map((_, i) => {
      const b = document.createElement('button');
      b.className = 'cell'; b.dataset.i = i;
      b.onclick = () => play(i);
      boardEl.appendChild(b); return b;
    });
    say();
  }
  function say(msg, win) {
    statusEl.textContent = msg || (mode() === 'cpu'
      ? (turn === 'X' ? 'Your move (X)' : 'Computer thinking…')
      : turn + "'s move");
    statusEl.classList.toggle('win', !!win);
  }
  function mode() { return modeEl.value; }
  function winner(bd) {
    for (const [a,c,d] of WINS) if (bd[a] && bd[a] === bd[c] && bd[a] === bd[d]) return {p: bd[a], line: [a,c,d]};
    return bd.every(Boolean) ? {p:'D'} : null;
  }
  function play(i) {
    if (over || board[i]) return;
    place(i);
    if (over) return;
    if (mode() === 'cpu' && turn === 'O') {
      say(null);
      setTimeout(() => { if (!over) place(cpuMove()); }, 260);
    }
  }
  function place(i) {
    board[i] = turn;
    const c = cells[i];
    c.textContent = turn; c.classList.add('taken', turn.toLowerCase());
    const w = winner(board);
    if (w) {
      over = true;
      if (w.p === 'D') { scores.D++; say("It's a draw."); }
      else {
        scores[w.p]++; say(w.p + ' wins! 🎉', true);
        w.line.forEach(j => cells[j].classList.add('line'));
      }
      document.getElementById('sx').textContent = scores.X;
      document.getElementById('so').textContent = scores.O;
      document.getElementById('sd').textContent = scores.D;
    } else {
      turn = turn === 'X' ? 'O' : 'X';
      say();
    }
  }
  function cpuMove() {
    // win > block > center > fork-ish corner > side
    for (const p of ['O','X']) {
      for (const line of WINS) {
        const vals = line.map(i => board[i]);
        if (vals.filter(v => v === p).length === 2 && vals.includes(null))
          return line[vals.indexOf(null)];
      }
    }
    if (!board[4]) return 4;
    const open = [0,2,6,8].filter(i => !board[i]);
    if (open.length) return open[Math.floor(Math.random() * open.length)];
    return [1,3,5,7].filter(i => !board[i])[0];
  }
  document.getElementById('new').onclick = newRound;
  modeEl.onchange = newRound;
  newRound();
})();
</script>
</body>
</html>
