<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .status {
            font-size: 1.3em;
            margin: 20px 0;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
            font-weight: bold;
            color: #555;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 30px 0;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: #f8f9fa;
            border: 3px solid #667eea;
            border-radius: 10px;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .cell:hover:not(.taken) {
            background: #e9ecef;
            transform: scale(1.05);
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #764ba2;
        }

        .cell.winner {
            background: #d4edda;
            border-color: #28a745;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-restart {
            background: #667eea;
            color: white;
        }

        .btn-restart:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-swap {
            background: #f0f0f0;
            color: #333;
        }

        .btn-swap:hover {
            background: #e0e0e0;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .score {
            text-align: center;
        }

        .score-value {
            font-size: 2em;
            font-weight: bold;
        }

        .score-x .score-value {
            color: #667eea;
        }

        .score-o .score-value {
            color: #764ba2;
        }

        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 10px;
            font-size: 0.9em;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Tic-Tac-Toe</h1>
        
        <div class="score-board">
            <div class="score score-x">
                <div>Player X</div>
                <div class="score-value" id="scoreX">0</div>
            </div>
            <div class="score score-o">
                <div>Player O</div>
                <div class="score-value" id="scoreO">0</div>
            </div>
        </div>

        <div class="status" id="status">Player X's turn</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="controls">
            <button class="btn-restart" onclick="restartGame()">🔄 New Game</button>
            <button class="btn-swap" onclick="swapPlayers()">🔄 Swap Starting Player</button>
        </div>

        <div class="instructions">
            <strong>How to play:</strong> Click on any empty square to place your mark. 
            Get 3 in a row (horizontal, vertical, or diagonal) to win!
        </div>
    </div>

    <script>
        // Game state
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let scores = { X: 0, O: 0 };
        let startingPlayer = 'X';

        // Winning combinations
        const winPatterns = [
            [0, 1, 2], // Top row
            [3, 4, 5], // Middle row
            [6, 7, 8], // Bottom row
            [0, 3, 6], // Left column
            [1, 4, 7], // Middle column
            [2, 5, 8], // Right column
            [0, 4, 8], // Diagonal
            [2, 4, 6]  // Anti-diagonal
        ];

        // Get DOM elements
        const statusDisplay = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');

        // Initialize the game
        function init() {
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });
            updateStatus();
        }

        // Handle cell click
        function handleCellClick(event) {
            const cell = event.target;
            const index = parseInt(cell.getAttribute('data-index'));

            // Check if cell is already taken or game is over
            if (board[index] !== '' || !gameActive) {
                return;
            }

            // Make the move
            board[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add('taken', currentPlayer.toLowerCase());

            // Check for win or draw
            if (checkWin()) {
                gameActive = false;
                highlightWinningCells();
                statusDisplay.textContent = `🎉 Player ${currentPlayer} WINS! 🎉`;
                scores[currentPlayer]++;
                updateScoreBoard();
                return;
            }

            if (checkDraw()) {
                gameActive = false;
                statusDisplay.textContent = "🤝 It's a DRAW! Well played!";
                return;
            }

            // Switch player
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatus();
        }

        // Check for win
        function checkWin() {
            return winPatterns.some(pattern => {
                return pattern.every(index => board[index] === currentPlayer);
            });
        }

        // Check for draw
        function checkDraw() {
            return board.every(cell => cell !== '');
        }

        // Highlight winning cells
        function highlightWinningCells() {
            winPatterns.forEach(pattern => {
                if (pattern.every(index => board[index] === currentPlayer)) {
                    pattern.forEach(index => {
                        cells[index].classList.add('winner');
                    });
                }
            });
        }

        // Update status display
        function updateStatus() {
            statusDisplay.textContent = `Player ${currentPlayer}'s turn`;
        }

        // Update score board
        function updateScoreBoard() {
            document.getElementById('scoreX').textContent = scores.X;
            document.getElementById('scoreO').textContent = scores.O;
        }

        // Restart the game
        function restartGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = startingPlayer;
            
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('taken', 'x', 'o', 'winner');
            });
            
            updateStatus();
        }

        // Swap starting player
        function swapPlayers() {
            startingPlayer = startingPlayer === 'X' ? 'O' : 'X';
            currentPlayer = startingPlayer;
            restartGame();
            statusDisplay.textContent = `Starting player changed to ${startingPlayer}!`;
        }

        // Initialize on page load
        init();
    </script>
</body>
</html>
